name: pages

# Deploy the documents to GitHub Pages:
#
#   https://rdf-array.github.io/rdf-array/html-index.html   (the repository's homepage)
#   https://rdf-array.github.io/rdf-array/rdf-array.html
#   https://rdf-array.github.io/rdf-array/json-ld-array.html
#   https://rdf-array.github.io/rdf-array/shacl-array.html
#   https://rdf-array.github.io/rdf-array/owl-array.html
#   https://rdf-array.github.io/rdf-array/repos.html        (rendered from repos.json in the browser)
#
# The tracked tree is the site: each .html is generated from its .md by
# md-to-respec.py and committed, so nothing is built here; html-index.html is
# hand-written, and there is no index.html, the README being the front page
# on GitHub. Modelled on shex.js-array's pages.yml.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions" (configure-pages
# with `enablement: true` does it on the first run when the token may).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check that the HTML renderings are current
        run: |
          for doc in rdf-array json-ld-array shacl-array owl-array; do
            python3 md-to-respec.py "$doc.md" "/tmp/$doc.html"
            if ! diff -q "/tmp/$doc.html" "$doc.html" >/dev/null; then
              echo "$doc.html is out of date: run python3 md-to-respec.py $doc.md $doc.html" >&2
              exit 1
            fi
          done
      - name: check repos.json and the links into repos.html
        run: python3 tools/manifest-check.py --offline
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
